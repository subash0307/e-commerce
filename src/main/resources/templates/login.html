<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - ApexStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center py-5">

    <div class="container" style="max-width: 480px;">
        <div class="text-center mb-4">
            <a class="navbar-brand fw-bold d-inline-flex align-items-center gap-2 mb-2 text-decoration-none" href="/">
                <i class="bi bi-bag-heart-fill text-primary fs-2"></i>
                <span class="brand-text fs-2">Apex<span class="text-primary">Store</span></span>
            </a>
            <p class="text-secondary small">Sign in to manage your orders, cart, and dashboard</p>
        </div>

        <!-- Flash messages -->
        <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${successMessage}">
            <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${errorMessage}">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card bg-dark border-secondary rounded-4 p-4 p-sm-5 shadow-lg">
            <h4 class="fw-bold text-white mb-4">Account Login</h4>

            <!-- Quick Demo Credentials Fill -->
            <div class="p-3 bg-darker rounded-3 border border-secondary mb-4">
                <span class="text-secondary small d-block mb-2"><i class="bi bi-key-fill text-warning me-1"></i> Quick Test Credentials:</span>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-sm btn-outline-warning rounded-pill flex-fill" onclick="fillCredentials('admin@apexstore.com', 'admin123')">
                        Fill Admin
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-info rounded-pill flex-fill" onclick="fillCredentials('customer@apexstore.com', 'user123')">
                        Fill Customer
                    </button>
                </div>
            </div>

            <form th:action="@{/login/submit}" method="post">
                <div class="mb-3">
                    <label class="form-label text-secondary small">Email Address</label>
                    <input type="email" id="emailInput" name="email" class="form-control bg-dark text-white border-secondary py-2" required placeholder="name@example.com">
                </div>
                <div class="mb-4">
                    <label class="form-label text-secondary small">Password</label>
                    <input type="password" id="passwordInput" name="password" class="form-control bg-dark text-white border-secondary py-2" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary rounded-pill w-100 py-3 fw-semibold shadow">
                    Sign In
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top border-secondary">
                <span class="text-secondary small">Don't have an account? </span>
                <a href="/register" class="text-primary small fw-semibold text-decoration-none">Create one</a>
            </div>
        </div>

        <div class="text-center mt-4">
            <a href="/" class="text-secondary small text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Return to Storefront</a>
        </div>
    </div>

    <script>
        function fillCredentials(email, pass) {
            document.getElementById('emailInput').value = email;
            document.getElementById('passwordInput').value = pass;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
