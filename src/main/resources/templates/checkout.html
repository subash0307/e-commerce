<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - ApexStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>

    <!-- Main Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
                <i class="bi bi-bag-heart-fill text-primary fs-3"></i>
                <span class="brand-text">Apex<span class="text-primary">Store</span></span>
            </a>
            <a href="/cart" class="btn btn-outline-light rounded-pill px-3 ms-auto"><i class="bi bi-arrow-left me-1"></i> Back to Cart</a>
        </div>
    </nav>

    <!-- Checkout Form -->
    <div class="container py-5">
        <h2 class="fw-bold text-white mb-4"><i class="bi bi-shield-lock-fill text-primary me-2"></i> Secure Checkout</h2>

        <div class="alert alert-danger" th:if="${errorMessage}">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/checkout/confirm}" method="post">
            <div class="row g-5">
                <!-- Shipping Details -->
                <div class="col-lg-7">
                    <div class="card bg-dark border-secondary rounded-4 p-4 shadow mb-4">
                        <h5 class="fw-bold text-white mb-3">1. Shipping Address</h5>
                        <div class="mb-3">
                            <label class="form-label text-secondary small">Recipient Full Name</label>
                            <input type="text" class="form-control bg-dark text-white border-secondary" th:value="${user.fullName}" readonly />
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-secondary small">Delivery Address *</label>
                            <textarea name="shippingAddress" rows="3" class="form-control bg-dark text-white border-secondary" required th:text="${user.address != null ? user.address : '100 Market St, San Francisco, CA 94105'}"></textarea>
                        </div>
                    </div>

                    <div class="card bg-dark border-secondary rounded-4 p-4 shadow">
                        <h5 class="fw-bold text-white mb-3">2. Payment Method</h5>
                        <div class="form-check p-3 bg-darker rounded-3 border border-secondary mb-2">
                            <input class="form-check-input ms-0 me-3" type="radio" name="paymentMethod" id="payCredit" value="Credit Card (Demo Mode)" checked>
                            <label class="form-check-label text-white d-flex align-items-center gap-2" for="payCredit">
                                <i class="bi bi-credit-card-2-front text-primary fs-5"></i> Credit / Debit Card (Simulated Instant Approval)
                            </label>
                        </div>
                        <div class="form-check p-3 bg-darker rounded-3 border border-secondary mb-2">
                            <input class="form-check-input ms-0 me-3" type="radio" name="paymentMethod" id="payPaypal" value="PayPal">
                            <label class="form-check-label text-white d-flex align-items-center gap-2" for="payPaypal">
                                <i class="bi bi-paypal text-info fs-5"></i> PayPal Express
                            </label>
                        </div>
                        <div class="form-check p-3 bg-darker rounded-3 border border-secondary">
                            <input class="form-check-input ms-0 me-3" type="radio" name="paymentMethod" id="payCod" value="Cash On Delivery">
                            <label class="form-check-label text-white d-flex align-items-center gap-2" for="payCod">
                                <i class="bi bi-cash-stack text-success fs-5"></i> Cash on Delivery (COD)
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Order Review Panel -->
                <div class="col-lg-5">
                    <div class="card bg-dark border-secondary rounded-4 p-4 shadow">
                        <h5 class="fw-bold text-white mb-3">Order Summary (<span th:text="${cartItems.size()}"></span> items)</h5>
                        
                        <div class="list-group list-group-flush bg-transparent mb-3">
                            <div th:each="item : ${cartItems}" class="list-group-item bg-transparent text-light border-secondary px-0 d-flex justify-content-between align-items-center">
                                <div>
                                    <div class="fw-semibold" th:text="${item.product.name}">Product</div>
                                    <small class="text-secondary">Qty: <span th:text="${item.quantity}"></span> x $<span th:text="${item.product.price}"></span></small>
                                </div>
                                <span class="fw-bold text-white">$<span th:text="${#numbers.formatDecimal(item.subtotal, 1, 2)}"></span></span>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between text-secondary mb-2">
                            <span>Subtotal</span>
                            <span class="text-white">$<span th:text="${#numbers.formatDecimal(cartTotal, 1, 2)}"></span></span>
                        </div>
                        <div class="d-flex justify-content-between text-secondary mb-2">
                            <span>Shipping</span>
                            <span class="text-success">FREE</span>
                        </div>
                        <hr class="border-secondary">
                        <div class="d-flex justify-content-between align-items-baseline mb-4">
                            <h5 class="fw-bold text-white mb-0">Total Due</h5>
                            <h3 class="fw-extrabold text-primary mb-0">$<span th:text="${#numbers.formatDecimal(cartTotal, 1, 2)}">0.00</span></h3>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg rounded-pill w-100 shadow py-3">
                            <i class="bi bi-lock-fill me-2"></i> Confirm & Place Order
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-secondary py-4 border-top border-secondary mt-auto">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 ApexStore Inc. Enterprise Portfolio Project.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
