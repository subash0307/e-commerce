<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Management - ApexStore Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>

    <!-- Admin Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm py-3 border-bottom border-warning">
        <div class="container-fluid px-lg-5">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/admin">
                <i class="bi bi-shield-lock-fill text-warning fs-3"></i>
                <span class="brand-text">Apex<span class="text-warning">Admin</span></span>
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item"><a class="nav-link text-secondary" href="/admin"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link text-secondary" href="/admin/products"><i class="bi bi-box-seam me-1"></i> Products</a></li>
                    <li class="nav-item"><a class="nav-link active text-white" href="/admin/orders"><i class="bi bi-receipt me-1"></i> Orders</a></li>
                    <li class="nav-item"><a class="nav-link text-secondary" href="/admin/users"><i class="bi bi-people me-1"></i> Customers</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <a href="/" class="btn btn-outline-light btn-sm rounded-pill px-3"><i class="bi bi-shop me-1"></i> View Store</a>
                    <a href="/logout" class="btn btn-danger btn-sm rounded-pill px-3"><i class="bi bi-box-arrow-right me-1"></i> Sign Out</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Orders Management Content -->
    <div class="container-fluid px-lg-5 py-5">
        <div class="mb-4">
            <h2 class="fw-bold text-white mb-1">Customer Orders</h2>
            <p class="text-secondary mb-0">Track customer purchases and update dispatch status</p>
        </div>

        <!-- Flash alerts -->
        <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${successMessage}">
            <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${errorMessage}">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card bg-dark border-secondary rounded-4 overflow-hidden shadow">
            <div class="table-responsive">
                <table class="table table-dark table-hover align-middle mb-0">
                    <thead class="text-secondary border-secondary small text-uppercase">
                        <tr>
                            <th class="ps-4 py-3">Order #</th>
                            <th class="py-3">Customer</th>
                            <th class="py-3">Date</th>
                            <th class="py-3">Total Amount</th>
                            <th class="py-3">Current Status</th>
                            <th class="pe-4 py-3 text-end" style="width: 280px;">Update Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="order : ${orders}">
                            <td class="ps-4 py-3">
                                <a th:href="@{/orders/{id}(id=${order.id})}" class="fw-bold text-white text-decoration-none" th:text="${order.orderNumber}">ORD-1234</a>
                            </td>
                            <td>
                                <strong class="text-light d-block" th:text="${order.user.fullName}">Customer Name</strong>
                                <small class="text-secondary" th:text="${order.user.email}">email</small>
                            </td>
                            <td class="text-secondary" th:text="${#temporals.format(order.orderDate, 'MMM dd, yyyy HH:mm')}">Date</td>
                            <td class="text-primary fw-bold">$<span th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}">0.00</span></td>
                            <td>
                                <span class="badge rounded-pill px-3 py-2"
                                      th:classappend="${order.status.name() == 'DELIVERED'} ? 'bg-success' : (${order.status.name() == 'SHIPPED'} ? 'bg-info text-dark' : (${order.status.name() == 'PROCESSING'} ? 'bg-primary' : 'bg-warning text-dark'))"
                                      th:text="${order.status}">Status</span>
                            </td>
                            <td class="pe-4 py-3 text-end">
                                <form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post" class="d-flex justify-content-end gap-2">
                                    <select name="status" class="form-select form-select-sm bg-dark text-white border-secondary" style="width: 140px;">
                                        <option th:each="st : ${allStatuses}" th:value="${st}" th:text="${st}" th:selected="${st == order.status}"></option>
                                    </select>
                                    <button type="submit" class="btn btn-sm btn-outline-warning rounded-pill px-3">
                                        Update
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
