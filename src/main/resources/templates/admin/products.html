<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management - ApexStore Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>

    <!-- Admin Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm py-3 border-bottom border-warning">
        <div class="container-fluid px-lg-5">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/admin">
                <i class="bi bi-shield-lock-fill text-warning fs-3"></i>
                <span class="brand-text">Apex<span class="text-warning">Admin</span></span>
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item"><a class="nav-link text-secondary" href="/admin"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active text-white" href="/admin/products"><i class="bi bi-box-seam me-1"></i> Products</a></li>
                    <li class="nav-item"><a class="nav-link text-secondary" href="/admin/orders"><i class="bi bi-receipt me-1"></i> Orders</a></li>
                    <li class="nav-item"><a class="nav-link text-secondary" href="/admin/users"><i class="bi bi-people me-1"></i> Customers</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <a href="/" class="btn btn-outline-light btn-sm rounded-pill px-3"><i class="bi bi-shop me-1"></i> View Store</a>
                    <a href="/logout" class="btn btn-danger btn-sm rounded-pill px-3"><i class="bi bi-box-arrow-right me-1"></i> Sign Out</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Product Management Content -->
    <div class="container-fluid px-lg-5 py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold text-white mb-1">Product Inventory (CRUD)</h2>
                <p class="text-secondary mb-0">Manage store listings, live pricing, stock allocations, and imagery</p>
            </div>
            <a href="/admin/products/new" class="btn btn-primary rounded-pill px-4 shadow">
                <i class="bi bi-plus-circle me-1"></i> Add New Product
            </a>
        </div>

        <!-- Flash alerts -->
        <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${successMessage}">
            <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${errorMessage}">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card bg-dark border-secondary rounded-4 overflow-hidden shadow">
            <div class="table-responsive">
                <table class="table table-dark table-hover align-middle mb-0">
                    <thead class="text-secondary border-secondary small text-uppercase">
                        <tr>
                            <th class="ps-4 py-3" style="width: 80px;">Item</th>
                            <th class="py-3">Name</th>
                            <th class="py-3">Category</th>
                            <th class="py-3">Price</th>
                            <th class="py-3 text-center">Stock</th>
                            <th class="pe-4 py-3 text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="product : ${products}">
                            <td class="ps-4 py-3">
                                <img th:src="${product.imageUrl}" class="rounded-3" style="width: 50px; height: 50px; object-fit: cover;" alt="Product">
                            </td>
                            <td>
                                <strong class="text-white d-block" th:text="${product.name}">Product Name</strong>
                                <small class="text-secondary" th:text="${#strings.abbreviate(product.description, 60)}">Desc</small>
                            </td>
                            <td>
                                <span class="badge bg-secondary" th:text="${product.category.name}">Category</span>
                            </td>
                            <td class="text-primary fw-bold">
                                $<span th:text="${#numbers.formatDecimal(product.price, 1, 2)}">0.00</span>
                            </td>
                            <td class="text-center">
                                <span th:if="${product.stockQuantity > 5}" class="badge bg-success-subtle text-success border border-success rounded-pill px-3 py-1" th:text="${product.stockQuantity} + ' in stock'"></span>
                                <span th:if="${product.stockQuantity <= 5 and product.stockQuantity > 0}" class="badge bg-warning-subtle text-warning border border-warning rounded-pill px-3 py-1" th:text="${product.stockQuantity} + ' low stock'"></span>
                                <span th:if="${product.stockQuantity == 0}" class="badge bg-danger-subtle text-danger border border-danger rounded-pill px-3 py-1">Out of stock</span>
                            </td>
                            <td class="pe-4 py-3 text-end">
                                <a th:href="@{/admin/products/edit/{id}(id=${product.id})}" class="btn btn-sm btn-outline-info rounded-pill px-3 me-1">
                                    <i class="bi bi-pencil me-1"></i> Edit
                                </a>
                                <a th:href="@{/admin/products/delete/{id}(id=${product.id})}" class="btn btn-sm btn-outline-danger rounded-pill px-3" onclick="return confirm('Are you sure you want to delete this product?');">
                                    <i class="bi bi-trash3 me-1"></i> Delete
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
