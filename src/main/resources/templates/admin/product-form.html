<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Editor - ApexStore Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>

    <!-- Admin Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm py-3 border-bottom border-warning">
        <div class="container-fluid px-lg-5">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/admin">
                <i class="bi bi-shield-lock-fill text-warning fs-3"></i>
                <span class="brand-text">Apex<span class="text-warning">Admin</span></span>
            </a>
            <a href="/admin/products" class="btn btn-outline-light btn-sm rounded-pill px-3 ms-auto">
                <i class="bi bi-arrow-left me-1"></i> Back to Products
            </a>
        </div>
    </nav>

    <!-- Product Form -->
    <div class="container py-5" style="max-width: 720px;">
        <div class="card bg-dark border-secondary rounded-4 p-4 p-sm-5 shadow-lg">
            <h3 class="fw-bold text-white mb-2" th:text="${productDto.id != null} ? 'Edit Product' : 'Add New Product'">
                Add New Product
            </h3>
            <p class="text-secondary small mb-4">Complete the fields below to update your live store catalog.</p>

            <form th:action="@{/admin/products/save}" th:object="${productDto}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label class="form-label text-secondary small">Product Title *</label>
                    <input type="text" th:field="*{name}" class="form-control bg-dark text-white border-secondary py-2" required placeholder="e.g. Ultra Wireless ANC Headphones">
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label text-secondary small">Category *</label>
                        <select th:field="*{categoryId}" class="form-select bg-dark text-white border-secondary py-2" required>
                            <option value="">Select Category...</option>
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Category</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label text-secondary small">Price ($) *</label>
                        <input type="number" step="0.01" th:field="*{price}" class="form-control bg-dark text-white border-secondary py-2" required min="0.01" placeholder="99.99">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label text-secondary small">Stock Qty *</label>
                        <input type="number" th:field="*{stockQuantity}" class="form-control bg-dark text-white border-secondary py-2" required min="0" placeholder="20">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label text-secondary small">Product Image URL</label>
                    <input type="url" th:field="*{imageUrl}" class="form-control bg-dark text-white border-secondary py-2" placeholder="https://images.unsplash.com/photo-...">
                    <small class="text-secondary">Direct link to product preview image (Unsplash, Cloudinary, etc.)</small>
                </div>

                <div class="mb-4">
                    <label class="form-label text-secondary small">Product Description</label>
                    <textarea th:field="*{description}" rows="4" class="form-control bg-dark text-white border-secondary" placeholder="Key technical specifications, materials, and highlights..."></textarea>
                </div>

                <div class="d-flex gap-3">
                    <a href="/admin/products" class="btn btn-outline-secondary rounded-pill px-4 flex-fill">Cancel</a>
                    <button type="submit" class="btn btn-primary rounded-pill px-4 flex-fill shadow">
                        <i class="bi bi-save me-1"></i> Save Product
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
