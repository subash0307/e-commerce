<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management - ApexStore Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>

    <!-- Admin Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm py-3 border-bottom border-warning">
        <div class="container-fluid px-lg-5">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/admin">
                <i class="bi bi-shield-lock-fill text-warning fs-3"></i>
                <span class="brand-text">Apex<span class="text-warning">Admin</span></span>
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item"><a class="nav-link text-secondary" href="/admin"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link text-secondary" href="/admin/products"><i class="bi bi-box-seam me-1"></i> Products</a></li>
                    <li class="nav-item"><a class="nav-link text-secondary" href="/admin/orders"><i class="bi bi-receipt me-1"></i> Orders</a></li>
                    <li class="nav-item"><a class="nav-link active text-white" href="/admin/users"><i class="bi bi-people me-1"></i> Customers</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <a href="/" class="btn btn-outline-light btn-sm rounded-pill px-3"><i class="bi bi-shop me-1"></i> View Store</a>
                    <a href="/logout" class="btn btn-danger btn-sm rounded-pill px-3"><i class="bi bi-box-arrow-right me-1"></i> Sign Out</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Users Management Content -->
    <div class="container-fluid px-lg-5 py-5">
        <div class="mb-4">
            <h2 class="fw-bold text-white mb-1">Customer Accounts</h2>
            <p class="text-secondary mb-0">Registered shoppers and system administrators</p>
        </div>

        <div class="card bg-dark border-secondary rounded-4 overflow-hidden shadow">
            <div class="table-responsive">
                <table class="table table-dark table-hover align-middle mb-0">
                    <thead class="text-secondary border-secondary small text-uppercase">
                        <tr>
                            <th class="ps-4 py-3" style="width: 80px;">ID</th>
                            <th class="py-3">Full Name</th>
                            <th class="py-3">Email Address</th>
                            <th class="py-3">Phone</th>
                            <th class="py-3">Default Address</th>
                            <th class="pe-4 py-3 text-end">Role</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td class="ps-4 py-3 text-secondary" th:text="${user.id}">1</td>
                            <td class="fw-bold text-white">
                                <i class="bi bi-person-circle text-primary me-2"></i>
                                <span th:text="${user.fullName}">User Name</span>
                            </td>
                            <td class="text-light" th:text="${user.email}">user@example.com</td>
                            <td class="text-secondary" th:text="${user.phone != null ? user.phone : 'N/A'}">Phone</td>
                            <td class="text-secondary" th:text="${user.address != null ? user.address : 'N/A'}">Address</td>
                            <td class="pe-4 py-3 text-end">
                                <span class="badge rounded-pill px-3 py-1"
                                      th:classappend="${user.role.name() == 'ROLE_ADMIN'} ? 'bg-warning text-dark' : 'bg-info text-dark'"
                                      th:text="${user.role}">Role</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
