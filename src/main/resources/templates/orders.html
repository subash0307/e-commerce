<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - ApexStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>

    <!-- Main Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
                <i class="bi bi-bag-heart-fill text-primary fs-3"></i>
                <span class="brand-text">Apex<span class="text-primary">Store</span></span>
            </a>
            <div class="d-flex align-items-center gap-3 ms-auto">
                <a href="/products" class="btn btn-outline-light rounded-pill px-3">Catalog</a>
                <a href="/cart" class="btn btn-outline-light position-relative rounded-pill px-3">
                    <i class="bi bi-cart3 me-1"></i> Cart
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" th:text="${cartCount}">0</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Orders List -->
    <div class="container py-5">
        <h2 class="fw-bold text-white mb-4"><i class="bi bi-box-seam text-primary me-2"></i> Your Order History</h2>

        <div th:if="${orders.empty}" class="text-center py-5 card bg-dark border-secondary rounded-4 p-5">
            <i class="bi bi-clock-history text-secondary display-1 mb-3"></i>
            <h4 class="text-white">No previous orders found</h4>
            <p class="text-secondary">When you purchase items, their status and receipts will show up here.</p>
            <div class="mt-3">
                <a href="/products" class="btn btn-primary rounded-pill px-4 py-2">Start Shopping</a>
            </div>
        </div>

        <div class="row g-4" th:if="${!orders.empty}">
            <div class="col-12" th:each="order : ${orders}">
                <div class="card bg-dark border-secondary rounded-4 p-4 shadow-sm hover-card">
                    <div class="row align-items-center gy-3">
                        <div class="col-md-3">
                            <span class="text-secondary small d-block">Order Number</span>
                            <span class="text-white fw-bold" th:text="${order.orderNumber}">ORD-12345678</span>
                        </div>
                        <div class="col-md-3">
                            <span class="text-secondary small d-block">Order Date</span>
                            <span class="text-light" th:text="${#temporals.format(order.orderDate, 'MMM dd, yyyy HH:mm')}">Date</span>
                        </div>
                        <div class="col-md-2">
                            <span class="text-secondary small d-block">Total Amount</span>
                            <span class="text-primary fw-bold fs-5">$<span th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}">0.00</span></span>
                        </div>
                        <div class="col-md-2">
                            <span class="text-secondary small d-block">Status</span>
                            <span class="badge rounded-pill px-3 py-2"
                                  th:classappend="${order.status.name() == 'DELIVERED'} ? 'bg-success' : (${order.status.name() == 'SHIPPED'} ? 'bg-info text-dark' : (${order.status.name() == 'PROCESSING'} ? 'bg-primary' : 'bg-warning text-dark'))"
                                  th:text="${order.status}">Status</span>
                        </div>
                        <div class="col-md-2 text-md-end">
                            <a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-outline-light rounded-pill px-3">
                                View Receipt <i class="bi bi-chevron-right ms-1"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-secondary py-4 border-top border-secondary mt-auto">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 ApexStore Inc. Enterprise Portfolio Project.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
