<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - ApexStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center py-5">

    <div class="container" style="max-width: 520px;">
        <div class="text-center mb-4">
            <a class="navbar-brand fw-bold d-inline-flex align-items-center gap-2 mb-2 text-decoration-none" href="/">
                <i class="bi bi-bag-heart-fill text-primary fs-2"></i>
                <span class="brand-text fs-2">Apex<span class="text-primary">Store</span></span>
            </a>
            <p class="text-secondary small">Join thousands of customers shopping on ApexStore</p>
        </div>

        <div class="alert alert-danger" th:if="${errorMessage}">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}"></span>
        </div>

        <div class="card bg-dark border-secondary rounded-4 p-4 p-sm-5 shadow-lg">
            <h4 class="fw-bold text-white mb-4">Register Account</h4>

            <form th:action="@{/register/submit}" method="post">
                <div class="mb-3">
                    <label class="form-label text-secondary small">Full Name *</label>
                    <input type="text" name="fullName" class="form-control bg-dark text-white border-secondary py-2" required placeholder="John Doe">
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary small">Email Address *</label>
                    <input type="email" name="email" class="form-control bg-dark text-white border-secondary py-2" required placeholder="john@example.com">
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary small">Password * (min 6 characters)</label>
                    <input type="password" name="password" class="form-control bg-dark text-white border-secondary py-2" required minlength="6" placeholder="••••••••">
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary small">Phone Number</label>
                    <input type="tel" name="phone" class="form-control bg-dark text-white border-secondary py-2" placeholder="+1 555-0199">
                </div>
                <div class="mb-4">
                    <label class="form-label text-secondary small">Delivery Address</label>
                    <textarea name="address" rows="2" class="form-control bg-dark text-white border-secondary" placeholder="123 Main St, Apt 4B, City, Country"></textarea>
                </div>

                <button type="submit" class="btn btn-primary rounded-pill w-100 py-3 fw-semibold shadow">
                    Complete Registration
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top border-secondary">
                <span class="text-secondary small">Already have an account? </span>
                <a href="/login" class="text-primary small fw-semibold text-decoration-none">Sign in</a>
            </div>
        </div>

        <div class="text-center mt-4">
            <a href="/" class="text-secondary small text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Return to Storefront</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
