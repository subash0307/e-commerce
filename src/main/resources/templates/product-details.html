<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.name} + ' - ApexStore'">Product Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>

    <!-- Main Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
                <i class="bi bi-bag-heart-fill text-primary fs-3"></i>
                <span class="brand-text">Apex<span class="text-primary">Store</span></span>
            </a>
            <div class="d-flex align-items-center gap-3 ms-auto">
                <a href="/products" class="btn btn-outline-light rounded-pill px-3"><i class="bi bi-arrow-left me-1"></i> Catalog</a>
                <a href="/cart" class="btn btn-outline-light position-relative rounded-pill px-3">
                    <i class="bi bi-cart3 me-1"></i> Cart
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" th:text="${cartCount}">0</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Product Details Content -->
    <div class="container py-5">
        <div class="row g-5 align-items-center">
            <div class="col-lg-6">
                <div class="card bg-dark border-secondary rounded-4 overflow-hidden shadow-lg">
                    <img th:src="${product.imageUrl}" class="w-100" style="max-height: 480px; object-fit: cover;" alt="Product Image">
                </div>
            </div>
            <div class="col-lg-6">
                <div class="ps-lg-3">
                    <span class="badge bg-primary-subtle text-primary border border-primary px-3 py-2 rounded-pill fw-semibold mb-3" th:text="${product.category.name}">
                        Category
                    </span>
                    <h1 class="fw-extrabold text-white mb-3" th:text="${product.name}">Product Name</h1>
                    
                    <div class="d-flex align-items-baseline gap-3 mb-4">
                        <h2 class="fw-bold text-primary mb-0">$<span th:text="${#numbers.formatDecimal(product.price, 1, 2)}">0.00</span></h2>
                        <span th:if="${product.stockQuantity > 0}" class="badge bg-success-subtle text-success border border-success rounded-pill px-3 py-1">
                            <i class="bi bi-check-circle me-1"></i> In Stock (<span th:text="${product.stockQuantity}"></span> units)
                        </span>
                        <span th:if="${product.stockQuantity == 0}" class="badge bg-danger-subtle text-danger border border-danger rounded-pill px-3 py-1">
                            Out of Stock
                        </span>
                    </div>

                    <p class="text-secondary lead fs-6 mb-4" th:text="${product.description}">
                        Product Description goes here.
                    </p>

                    <!-- Add to Cart Form -->
                    <form th:action="@{/cart/add}" method="post" class="mb-4">
                        <input type="hidden" name="productId" th:value="${product.id}" />
                        <div class="d-flex align-items-center gap-3">
                            <div style="width: 120px;">
                                <label class="text-secondary small d-block mb-1">Quantity</label>
                                <input type="number" name="quantity" class="form-control bg-dark text-white border-secondary text-center" value="1" min="1" th:max="${product.stockQuantity}" th:disabled="${product.stockQuantity == 0}" />
                            </div>
                            <div class="flex-grow-1 pt-4">
                                <button type="submit" class="btn btn-primary btn-lg rounded-pill w-100 shadow" th:disabled="${product.stockQuantity == 0}">
                                    <i class="bi bi-cart-plus-fill me-2"></i> Add to Shopping Cart
                                </button>
                            </div>
                        </div>
                    </form>

                    <!-- Feature Perquisites -->
                    <div class="row g-3 pt-4 border-top border-secondary">
                        <div class="col-sm-6 d-flex align-items-center gap-3">
                            <i class="bi bi-truck text-primary fs-3"></i>
                            <div>
                                <h6 class="text-white mb-0">Free Global Shipping</h6>
                                <span class="text-secondary small">Delivery in 2-3 business days</span>
                            </div>
                        </div>
                        <div class="col-sm-6 d-flex align-items-center gap-3">
                            <i class="bi bi-shield-check text-success fs-3"></i>
                            <div>
                                <h6 class="text-white mb-0">2-Year Warranty</h6>
                                <span class="text-secondary small">Comprehensive coverage</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-secondary py-4 border-top border-secondary mt-auto">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 ApexStore Inc. Enterprise Portfolio Project.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
