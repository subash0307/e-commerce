<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Receipt - ApexStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>

    <!-- Main Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
                <i class="bi bi-bag-heart-fill text-primary fs-3"></i>
                <span class="brand-text">Apex<span class="text-primary">Store</span></span>
            </a>
            <div class="d-flex align-items-center gap-3 ms-auto">
                <a href="/orders" class="btn btn-outline-light rounded-pill px-3"><i class="bi bi-arrow-left me-1"></i> All Orders</a>
                <a href="/products" class="btn btn-primary rounded-pill px-3">Catalog</a>
            </div>
        </div>
    </nav>

    <!-- Receipt Container -->
    <div class="container py-5" style="max-width: 860px;">
        <div class="card bg-dark border-secondary rounded-4 p-5 shadow-lg">
            <div class="d-flex flex-wrap justify-content-between align-items-center pb-4 mb-4 border-bottom border-secondary">
                <div>
                    <span class="badge bg-success-subtle text-success border border-success px-3 py-1 rounded-pill mb-2">
                        <i class="bi bi-check-circle-fill me-1"></i> Order Confirmed
                    </span>
                    <h3 class="fw-bold text-white mb-0" th:text="${order.orderNumber}">ORD-12345678</h3>
                    <small class="text-secondary" th:text="${#temporals.format(order.orderDate, 'MMMM dd, yyyy - hh:mm a')}">Date</small>
                </div>
                <div>
                    <span class="badge rounded-pill px-4 py-2 fs-6"
                          th:classappend="${order.status.name() == 'DELIVERED'} ? 'bg-success' : (${order.status.name() == 'SHIPPED'} ? 'bg-info text-dark' : 'bg-primary')"
                          th:text="${order.status}">Processing</span>
                </div>
            </div>

            <!-- Customer & Delivery Details -->
            <div class="row g-4 mb-4">
                <div class="col-md-6">
                    <h6 class="text-secondary small text-uppercase fw-bold">Shipping Address</h6>
                    <p class="text-white mb-0" th:text="${order.shippingAddress}">Address</p>
                </div>
                <div class="col-md-6">
                    <h6 class="text-secondary small text-uppercase fw-bold">Payment Method</h6>
                    <p class="text-white mb-0" th:text="${order.paymentMethod}">Credit Card</p>
                </div>
            </div>

            <!-- Items Table -->
            <div class="table-responsive mb-4">
                <table class="table table-dark table-sm align-middle">
                    <thead class="text-secondary border-secondary small text-uppercase">
                        <tr>
                            <th class="py-2">Item</th>
                            <th class="py-2 text-center">Qty</th>
                            <th class="py-2 text-end">Price</th>
                            <th class="py-2 text-end">Subtotal</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${order.items}">
                            <td class="py-3">
                                <span class="fw-semibold text-white" th:text="${item.product.name}">Product</span>
                            </td>
                            <td class="py-3 text-center" th:text="${item.quantity}">1</td>
                            <td class="py-3 text-end text-secondary">$<span th:text="${#numbers.formatDecimal(item.price, 1, 2)}"></span></td>
                            <td class="py-3 text-end text-white fw-bold">$<span th:text="${#numbers.formatDecimal(item.subtotal, 1, 2)}"></span></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Order Total -->
            <div class="p-4 bg-darker rounded-3 border border-secondary">
                <div class="d-flex justify-content-between align-items-baseline">
                    <h5 class="fw-bold text-white mb-0">Total Paid</h5>
                    <h2 class="fw-extrabold text-primary mb-0">$<span th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}">0.00</span></h2>
                </div>
            </div>

            <div class="mt-4 text-center">
                <a href="/products" class="btn btn-outline-light rounded-pill px-4">Continue Shopping</a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-secondary py-4 border-top border-secondary mt-auto">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 ApexStore Inc. Enterprise Portfolio Project.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
