# ===================================================================
# Local Development Profile (In-Memory Database)
# Activate via: --spring.profiles.active=local
# ===================================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=ecommerce-platform-local

# In-Memory H2 DataSource (MySQL Mode compatibility)
# Architectural Note (Interview Prep):
# MODE=MySQL configures H2 to accept MySQL-specific syntax and keywords,
# allowing local development and testing without spinning up a live MySQL daemon.
spring.datasource.url=jdbc:h2:mem:ecommerce_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA / Hibernate for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Thymeleaf Live Reload
spring.thymeleaf.cache=false
