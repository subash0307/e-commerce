# ===================================================================
# Spring Boot E-Commerce Configuration
# ===================================================================

# Server Port Configuration
server.port=8080

# Application Name
spring.application.name=ecommerce-platform

# -------------------------------------------------------------------
# MySQL Database Configuration (DataSource & HikariCP)
# -------------------------------------------------------------------
# Architectural Note (Interview Prep):
# Parameters:
# - createDatabaseIfNotExist=true: Automatically provisions the schema if missing.
# - useSSL=false: Disables SSL for local development environments.
# - serverTimezone=UTC: Prevents timezone conversion anomalies between Java and MySQL.
# - allowPublicKeyRetrieval=true: Allows RSA key exchange with MySQL 8+ caching_sha2_password plugin.
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings (High-Performance Production Defaults)
# Minimum idle connections in the pool
spring.datasource.hikari.minimum-idle=5
# Maximum size of the pool
spring.datasource.hikari.maximum-pool-size=20
# Maximum time (in ms) a connection is allowed to sit idle before being closed
spring.datasource.hikari.idle-timeout=300000
# Maximum lifetime (in ms) of a connection in the pool
spring.datasource.hikari.max-lifetime=1800000
# Maximum time (in ms) that a client will wait for a connection from the pool
spring.datasource.hikari.connection-timeout=30000

# -------------------------------------------------------------------
# JPA & Hibernate ORM Configuration
# -------------------------------------------------------------------
# Architectural Note (Interview Prep):
# 'update': Automatically updates schema based on entity mappings (best for early development).
# 'validate': Validates table structure without changing schema (industry standard for staging/production).
spring.jpa.hibernate.ddl-auto=update

# Database Dialect for MySQL 8+
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# SQL Logging & Formatting
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
logging.level.org.hibernate.orm.jdbc.bind=trace

# Open Session In View (OSIV)
# Set to false to prevent database connections from staying open during view rendering
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Thymeleaf Configuration
# -------------------------------------------------------------------
# Disables template caching in development for instant UI updates
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# -------------------------------------------------------------------
# Multipart File Upload (Product Images)
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
